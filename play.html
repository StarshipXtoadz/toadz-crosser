<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="Play Toadz Crosser! — classic cartoon freeway hop." />
    <meta name="theme-color" content="#7ec8f5" />
    <title>Play — Toadz Crosser!</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='38' rx='20' ry='16' fill='%2358d83a' stroke='%231a1208' stroke-width='3'/%3E%3Ccircle cx='20' cy='22' r='9' fill='%2358d83a' stroke='%231a1208' stroke-width='3'/%3E%3Ccircle cx='44' cy='22' r='9' fill='%2358d83a' stroke='%231a1208' stroke-width='3'/%3E%3C/svg%3E"
    />
  </head>
  <body class="play-body">
    <header class="play-header">
      <h1>TOADZ CROSSER!</h1>
      <a href="index.html">← Home</a>
    </header>

    <div id="game-wrap">
      <canvas id="game" width="640" height="780" aria-label="Toadz Crosser game"></canvas>
    </div>

    <div class="touch-pad" aria-label="Touch controls">
      <div class="row">
        <button type="button" data-dir="up" aria-label="Hop up">▲</button>
      </div>
      <div class="row">
        <button type="button" data-dir="left" aria-label="Hop left">◀</button>
        <button type="button" data-dir="down" aria-label="Hop down">▼</button>
        <button type="button" data-dir="right" aria-label="Hop right">▶</button>
      </div>
    </div>

    <p class="hints">
      ENTER / SPACE start · Arrows / WASD hop · ESC menu
    </p>

    <script src="js/game.js"></script>
  </body>
</html>
